<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama UML - Abstract Factory</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f5f5f5; }
        svg { display: block; width: 100%; height: auto; }
    </style>
</head>
<body>
    <svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="abstract-factory-uml-title abstract-factory-uml-desc">
        <title id="abstract-factory-uml-title">Diagrama de classes do padrão Abstract Factory</title>
        <desc id="abstract-factory-uml-desc">Diagrama UML do sistema de atendimento médico, no qual fábricas de consulta presencial e teleconsulta criam prontuários e receitas correspondentes.</desc>
        <defs>
            <marker id="uml-realizacao" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
                <polygon points="0,0 16,6 0,12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
            </marker>
            <marker id="uml-dependencia" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
                <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
            </marker>
        </defs>

        <rect width="1280" height="800" fill="#f5f5f5"/>

        <!-- Relacionamentos -->
        <line x1="360" y1="108" x2="440" y2="108" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-dependencia)"/>

        <path d="M270,250 V210 Q270,202 278,202 H512 Q520,202 520,194 V166" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-realizacao)"/>
        <path d="M1010,250 V210 Q1010,202 1002,202 H768 Q760,202 760,194 V166" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-realizacao)"/>

        <path d="M580,166 V394 Q580,402 572,402 H388 Q380,402 380,410 V450" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-dependencia)"/>
        <path d="M700,166 V394 Q700,402 708,402 H892 Q900,402 900,410 V450" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-dependencia)"/>

        <line x1="170" y1="660" x2="170" y2="526" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-realizacao)"/>
        <path d="M470,660 V604 Q470,596 462,596 H338 Q330,596 330,588 V526" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-realizacao)"/>
        <line x1="810" y1="660" x2="810" y2="526" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-realizacao)"/>
        <path d="M1110,660 V604 Q1110,596 1102,596 H1048 Q1040,596 1040,588 V526" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-realizacao)"/>

        <!-- Paciente -->
        <rect x="60" y="50" width="300" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="60" y1="90" x2="360" y2="90" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="60" y1="130" x2="360" y2="130" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="210" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Paciente</text>
        <text x="76" y="108" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- prontuario: Prontuario</text>
        <text x="76" y="124" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- receita: Receita</text>
        <text x="76" y="148" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ obterProntuario(): String</text>
        <text x="76" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ obterReceita(): String</text>

        <!-- Fábrica abstrata -->
        <rect x="440" y="50" width="400" height="116" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <line x1="440" y1="106" x2="840" y2="106" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        <text x="640" y="72" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
        <text x="640" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">FabricaDocumentosMedicos</text>
        <text x="456" y="128" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ criarProntuario(): Prontuario</text>
        <text x="456" y="150" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ criarReceita(): Receita</text>

        <!-- Fábricas concretas -->
        <rect x="120" y="250" width="300" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="270" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">FabricaConsultaPresencial</text>
        <line x1="120" y1="294" x2="420" y2="294" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="136" y="314" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ criarProntuario(): Prontuario</text>
        <text x="136" y="332" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ criarReceita(): Receita</text>

        <rect x="860" y="250" width="300" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1010" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">FabricaTeleconsulta</text>
        <line x1="860" y1="294" x2="1160" y2="294" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="876" y="314" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ criarProntuario(): Prontuario</text>
        <text x="876" y="332" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ criarReceita(): Receita</text>

        <!-- Produtos abstratos -->
        <rect x="40" y="450" width="340" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="40" y1="496" x2="380" y2="496" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="210" y="474" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
        <text x="210" y="490" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Prontuario</text>
        <text x="56" y="518" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ gerar(): String</text>

        <rect x="730" y="450" width="340" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="730" y1="496" x2="1070" y2="496" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="900" y="474" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
        <text x="900" y="490" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Receita</text>
        <text x="746" y="518" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ gerar(): String</text>

        <!-- Produtos concretos -->
        <rect x="40" y="660" width="260" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="170" y="704" fill="#2d3142" font-size="11" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">ProntuarioConsultaPresencial</text>

        <rect x="340" y="660" width="260" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="470" y="704" fill="#2d3142" font-size="11" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">ProntuarioTeleconsulta</text>

        <rect x="680" y="660" width="260" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="810" y="704" fill="#2d3142" font-size="11" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">ReceitaConsultaPresencial</text>

        <rect x="980" y="660" width="260" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1110" y="704" fill="#2d3142" font-size="11" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">ReceitaTeleconsulta</text>
    </svg>
</body>
</html>
